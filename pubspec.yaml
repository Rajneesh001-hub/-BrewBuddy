name: brew_buddy
description: BrewBuddy - Coffee Order-Ahead & Rewards App for India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # State Management
  provider: ^6.1.2

  # QR Code
  qr_flutter: ^4.1.0

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Formatting
  intl: ^0.19.0

  # Local persistence
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
